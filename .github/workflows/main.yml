name: Python - Pruebas de excepciones

on:
  push:
    branches:
      -companero-4-excepciones-logs
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar pruebas de excepciones
        run: python -m src.pruebas.prueba_excepciones_logs
